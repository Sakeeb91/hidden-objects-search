[project]
name = "hos"
version = "0.1.0"
description = "Search public archival data for uncatalogued spider pulsars and compact objects"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=7",
    "astroquery>=0.4.10",
    "numpy>=2",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
    "lightkurve>=2.5",
    "wotan>=1.10",
    "scikit-learn>=1.5",
    "lsdb>=0.10.4",
    "s3fs>=2026.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "pipeline"]
markers = ["network: needs internet access to public archives"]
